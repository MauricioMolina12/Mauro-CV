<div class="tech-wrapper">
  <div class="section-head">
    <span class="eyebrow">{{ 'tech.eyebrow' | translate }}</span>
    <h2>{{ 'tech.title' | translate }}</h2>
    <p>{{ 'tech.subtitle' | translate }}</p>
  </div>

  <div class="bento">
    @for (category of categories; track category.title) {
      <div class="tech-cat" #cat [class.wide]="category.size === 'wide'">
        <h3>{{ category.title | translate }}</h3>
        <div class="tech-grid">
          @for (tech of category.techs; track tech.name) {
            <div class="tech">
              <span class="avatar">
                <img [src]="tech.icon" [alt]="tech.name" loading="lazy" decoding="async" />
              </span>
              <span class="tech-name">{{ tech.name }}</span>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
