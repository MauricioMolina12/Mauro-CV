<nav class="nav-bar" #nav>
  <div class="nav-title" (click)="onNavItemClick('home')">
    <span class="initial">M</span>
    <h1 class="name">
      Mauro
      <span>Molina</span>
    </h1>
  </div>

  <button class="burger" [class.active]="isActive" (click)="toggle()" aria-label="Abrir menú">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="nav-side_bar">
    <ul class="side-bar__list">
      @for (item of items; track item.path; let i = $index) {
        <li class="side-bar__item" [class.cta]="item.path === 'contact-me'" [style.--i]="i">
          <a #link href="#" (click)="onNavItemClick(item.path); $event.preventDefault()">
            <span class="idx">0{{ i + 1 }}</span>
            <span class="label">{{ item.name }}</span>
          </a>
        </li>
      }
      <!-- Toggle de tema: aria-label estático (sin mismatch de hidratación);
           el icono visible se alterna por CSS según data-theme. -->
      <li class="side-bar__theme">
        <button
          type="button"
          class="theme-toggle"
          aria-label="Cambiar entre modo claro y oscuro"
          title="Cambiar entre modo claro y oscuro"
          (click)="themeService.toggle()"
        >
          <!-- Sol → visible en modo oscuro (pulsar para pasar a claro) -->
          <svg class="theme-toggle__icon icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <!-- Luna → visible en modo claro (pulsar para pasar a oscuro) -->
          <svg class="theme-toggle__icon icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </li>
    </ul>
  </div>
</nav>
