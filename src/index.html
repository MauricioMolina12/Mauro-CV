<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <!-- Inicialización temprana del tema (anti-FOUC): se ejecuta antes del
         primer paint. Prioridad: preferencia guardada → sistema → light. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <title>Mauricio Molina · Portafolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portafolio de Mauricio Molina: Desarrollador Full Stack, Diseñador UI/UX y Desarrollador Móvil. Proyectos, experiencia y contacto."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="logo.png" />
    <!-- Fuente self-hosted (variable, subset latin) → sin CSS render-blocking externo. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/montserrat-variable.woff2"
      crossorigin
    />
    <!-- LCP del hero (background CSS): se descubre antes de parsear la hoja de estilos. -->
    <link rel="preload" as="image" href="/assets/banner2.webp" fetchpriority="high" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mauricio Molina · Portafolio" />
    <meta
      property="og:description"
      content="Desarrollador Full Stack, Diseñador UI/UX y Desarrollador Móvil. Proyectos, experiencia y contacto."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- TODO: añade el dominio real en rel="canonical" y og:url cuando despliegues. -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
